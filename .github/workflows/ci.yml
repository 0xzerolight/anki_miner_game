name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project --extra dev
      - run: uv run --no-sync black --check .
      - run: uv run --no-sync ruff check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project --extra dev
      - run: uv run --no-sync mypy anki_miner_game

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One red interpreter/OS must not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Qt's offscreen libraries, and the validators tests/test_installers.py skips when they are
      # missing (shellcheck, desktop-file-validate, appstreamcli).
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0 shellcheck desktop-file-utils appstream
      - run: uv sync --locked --no-install-project --extra dev
      # The marker deselect lives in pyproject addopts. Only the Windows step
      # overrides it (a CLI -m replaces addopts), to also run windows_only tests
      # (e.g. RegisterHotKey).
      - name: Test (Linux)
        if: runner.os != 'Windows'
        run: uv run --no-sync pytest
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: uv run --no-sync pytest -m "not vad and not obs_live and not network"
